name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Isolate pull requests by PR number. Stacked/sync PRs may reuse another
  # branch as their head; github.head_ref would let those runs cancel the
  # original feature PR's exact-head build.
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Yarn dependencies
        run: yarn

      - name: Build Android debug app
        working-directory: android
        run: >-
          ./gradlew :app:assembleDebug --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
