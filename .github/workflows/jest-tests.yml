name: Jest Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Use the pull-request number rather than head_ref so a stacked sync PR
  # cannot cancel the original feature PR's exact-head Jest run.
  group: jest-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Yarn install
        run: yarn

      - name: Jest
        run: yarn test:unit
