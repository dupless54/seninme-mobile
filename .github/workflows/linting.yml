name: Linting

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: linting-${{ format('{0}-{1}', github.head_ref || github.run_number, github.job) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: yarn

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Yarn install
        run: yarn

      - name: ESLint
        if: ${{ !cancelled() }}
        run: yarn eslint

      - name: Prettier
        if: ${{ !cancelled() }}
        run: yarn prettier

      - name: Fastlane Ruby syntax
        if: ${{ !cancelled() }}
        run: |
          ruby -c fastlane/Fastfile
          ruby -c fastlane/Matchfile
