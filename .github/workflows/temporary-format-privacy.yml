name: Temporary Privacy Formatter

on:
  push:
    branches:
      - feature/seninme-privacy-hardening-phase-13
    paths:
      - .github/workflows/temporary-format-privacy.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/seninme-privacy-hardening-phase-13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Format privacy regression test
        run: yarn prettier --write js/__tests__/privacy_identity.test.js

      - name: Commit exact formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dupless54"
          git config user.email "126967564+dupless54@users.noreply.github.com"
          git rm .github/workflows/temporary-format-privacy.yml
          git add js/__tests__/privacy_identity.test.js
          git commit -m "STYLE: apply exact privacy test formatting"
          git push origin HEAD:feature/seninme-privacy-hardening-phase-13
