name: Temporary Recovery Formatter

on:
  push:
    branches:
      - feature/seninme-single-site-recovery-phase-12
    paths:
      - .github/workflows/temporary-format-recovery.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/seninme-single-site-recovery-phase-12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Format recovery files
        run: >-
          yarn prettier --write
          js/screens/HomeScreen.js
          js/screens/HomeScreenComponents/SingleSiteRecovery.js
          js/screens/HomeScreenComponents/index.js
          js/seninme_bootstrap.js
          js/__tests__/single_site_recovery.test.js
          js/locale/en.json
          js/locale/tr_TR.json

      - name: Commit exact formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dupless54"
          git config user.email "126967564+dupless54@users.noreply.github.com"
          git rm .github/workflows/temporary-format-recovery.yml
          git add js/screens/HomeScreen.js js/screens/HomeScreenComponents/SingleSiteRecovery.js js/screens/HomeScreenComponents/index.js js/seninme_bootstrap.js js/__tests__/single_site_recovery.test.js js/locale/en.json js/locale/tr_TR.json
          git commit -m "STYLE: apply exact single-site recovery formatting"
          git push origin HEAD:feature/seninme-single-site-recovery-phase-12
