name: Temporary release identity formatter

on:
  push:
    branches:
      - feature/seninme-release-pipeline-phase-10

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/seninme-release-pipeline-phase-10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn
      - name: Format exact file
        run: yarn prettier --write js/__tests__/release_identity.test.js
      - name: Commit formatter result and remove temporary workflow
        run: |
          rm .github/workflows/temporary-format-release-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/__tests__/release_identity.test.js .github/workflows/temporary-format-release-identity.yml
          git commit -m "STYLE: apply exact Prettier output"
          git push origin HEAD:feature/seninme-release-pipeline-phase-10
