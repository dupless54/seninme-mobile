name: Temporary Settings Formatter

on:
  push:
    branches:
      - feature/seninme-settings-phase-4

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/seninme-settings-phase-4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Format Settings screen
        run: yarn prettier --write js/screens/SettingsScreen.js

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/screens/SettingsScreen.js
          if ! git diff --cached --quiet; then
            git commit -m "STYLE: apply repository Prettier output"
            git push origin HEAD:feature/seninme-settings-phase-4
          fi
