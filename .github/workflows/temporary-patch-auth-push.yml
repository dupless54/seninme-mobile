name: Temporary Auth Push Isolation Patch

on:
  push:
    branches:
      - feature/seninme-auth-push-isolation-phase-8

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/seninme-auth-push-isolation-phase-8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Patch auth and push configuration
        run: python scripts/patch-seninme-auth-push.py

      - name: Format patched file
        run: yarn prettier --write js/site_manager.js

      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-patch-auth-push.yml
          git rm scripts/patch-seninme-auth-push.py
          git add js/site_manager.js
          git commit -m "SECURITY: isolate Senin.me auth and push configuration"
          git push origin HEAD:feature/seninme-auth-push-isolation-phase-8
