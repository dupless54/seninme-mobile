name: Temporary Senin.me Icon Render

on:
  push:
    branches:
      - feature/seninme-branding-phase-11
    paths:
      - branding/seninme-app-icon.svg
      - .github/workflows/temporary-render-seninme-icons.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/seninme-branding-phase-11

      - name: Install SVG renderer
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render Senin.me app icons
        shell: bash
        run: |
          set -euo pipefail

          icon_dir="ios/Discourse/Images.xcassets/AppIcon.appiconset"
          normal_svg="branding/seninme-app-icon.svg"
          dark_svg="/tmp/seninme_dark.svg"
          tinted_svg="/tmp/seninme_tinted.svg"

          sed 's/#9D1B2C/#1A0A0E/g; s/#FFFFFF/#F6EFF1/g' "$normal_svg" > "$dark_svg"
          sed 's/#9D1B2C/#E6E6E6/g; s/#FFFFFF/#222222/g' "$normal_svg" > "$tinted_svg"

          rsvg-convert -w 1024 -h 1024 "$normal_svg" -o "$icon_dir/seninme.png"
          rsvg-convert -w 1024 -h 1024 "$dark_svg" -o "$icon_dir/seninme_dark.png"
          rsvg-convert -w 1024 -h 1024 "$tinted_svg" -o "$icon_dir/seninme_tinted.png"

          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          icon_dir = Path("ios/Discourse/Images.xcassets/AppIcon.appiconset")
          expected = (
              "seninme.png",
              "seninme_dark.png",
              "seninme_tinted.png",
          )

          for filename in expected:
              raw = (icon_dir / filename).read_bytes()
              if raw[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{filename} is not a PNG")
              width, height = struct.unpack(">II", raw[16:24])
              if (width, height) != (1024, 1024):
                  raise SystemExit(f"{filename} has unexpected size {width}x{height}")

          contents = {
              "images": [
                  {
                      "filename": "seninme.png",
                      "idiom": "universal",
                      "platform": "ios",
                      "size": "1024x1024",
                  },
                  {
                      "appearances": [{"appearance": "luminosity", "value": "dark"}],
                      "filename": "seninme_dark.png",
                      "idiom": "universal",
                      "platform": "ios",
                      "size": "1024x1024",
                  },
                  {
                      "appearances": [{"appearance": "luminosity", "value": "tinted"}],
                      "filename": "seninme_tinted.png",
                      "idiom": "universal",
                      "platform": "ios",
                      "size": "1024x1024",
                  },
              ],
              "info": {"author": "xcode", "version": 1},
          }
          (icon_dir / "Contents.json").write_text(json.dumps(contents, indent=2) + "\n")
          PY

          rm -f "$icon_dir/discourse.png" "$icon_dir/discourse_dark.png" "$icon_dir/discourse_tinted.png"
          cp "$icon_dir/seninme.png" icon.png

      - name: Commit rendered assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dupless54"
          git config user.email "126967564+dupless54@users.noreply.github.com"
          git rm .github/workflows/temporary-render-seninme-icons.yml
          git add branding/seninme-app-icon.svg icon.png ios/Discourse/Images.xcassets/AppIcon.appiconset
          git commit -m "BRAND: render Senin.me application icons"
          git push origin HEAD:feature/seninme-branding-phase-11
