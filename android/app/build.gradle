apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native application configuration.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def appVersionName = project.findProperty('MYAPP_VERSION') ?: '2.2.3'

def releaseSigningAvailable =
    project.hasProperty('MYAPP_RELEASE_STORE_FILE') &&
    project.hasProperty('MYAPP_RELEASE_STORE_PASSWORD') &&
    project.hasProperty('MYAPP_RELEASE_KEY_ALIAS') &&
    project.hasProperty('MYAPP_RELEASE_KEY_PASSWORD')

android {
    namespace 'me.senin.mobile'
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "me.senin.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        multiDexEnabled true
        versionCode 243
        versionName appVersionName
    }

    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            manifestPlaceholders = [permissionName: "android.permission.SYSTEM_ALERT_WINDOW"]
        }
        debug {
            manifestPlaceholders = [permissionName: "MADE.UP.To.Make.SYSTEM_ALERT_WINDOW.removal.work"]
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin.
    implementation("com.facebook.react:react-android")

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.5.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation 'org.jetbrains:annotations:16.0.2'
}

// Remote push is disabled until the Senin.me Firebase project is configured.
// A matching google-services.json enables the Google Services plugin automatically.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
